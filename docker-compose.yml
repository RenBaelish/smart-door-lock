services:
  db:
    image: pgvector/pgvector:pg16
    container_name: facelock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: facelock
      POSTGRES_PASSWORD: facelock
      POSTGRES_DB: facelock
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executed only on the first start (when the data volume is empty).
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facelock -d facelock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
